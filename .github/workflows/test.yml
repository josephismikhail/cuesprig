name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: cuesprig-chrome-extension
          path: dist/cuesprig/
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: python scripts/package-extension.py
      - shell: powershell
        run: |
          $archive = (Get-ChildItem -LiteralPath dist -Filter 'cuesprig-chrome-*.zip').FullName
          ./tests/install.test.ps1 -ArchivePath $archive
